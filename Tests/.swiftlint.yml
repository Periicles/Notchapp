# Tests state their expectations plainly: unwrapping a fixture or a long
# arrange block is clearer than defending against it.
disabled_rules:
  - force_unwrapping
  - function_body_length
  - type_body_length
  - file_length
  - identifier_name
  - type_name
  - multiline_arguments

line_length:
  warning: 160
  error: 200
