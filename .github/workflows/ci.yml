name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    env:
      # Runners preinstall untrusted taps (e.g. aws/tap); skip the trust
      # prompt so brew doesn't emit a tap-trust warning annotation.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint

  build:
    name: Build
    runs-on: macos-15
    needs: lint
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build -c release

  test:
    name: Test
    runs-on: macos-15
    needs: build
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
