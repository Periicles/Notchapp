name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        env:
          # Pinned: `brew install swiftlint` tracks latest, so a new default rule
          # can turn CI — and a release build — red with no code change.
          SWIFTLINT_VERSION: 0.65.0
        run: |
          curl -sSLf -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      # --strict: a warning is a violation, so the rule set cannot erode quietly.
      - name: Run SwiftLint
        run: swiftlint --strict

  build:
    name: Build
    runs-on: macos-15
    needs: lint
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build -c release

  # Pure logic and single types, no collaborators.
  unit:
    name: Unit tests
    runs-on: macos-15
    needs: lint
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: swift test --skip "IntegrationTests|E2ETests"

  # Several real objects wired together (model + calendar manager + preferences,
  # notifier + planner) against fakes of the system boundaries.
  integration:
    name: Integration tests
    runs-on: macos-15
    needs: unit
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Integration tests
        run: swift test --filter IntegrationTests

  # The real views rendered offscreen and checked pixel by pixel.
  e2e:
    name: E2E tests
    runs-on: macos-15
    needs: integration
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Rendering tests
        run: swift test --filter E2ETests

  coverage:
    name: Coverage
    runs-on: macos-15
    needs: e2e
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Run all tests with coverage
        run: swift test --enable-code-coverage
      - name: Enforce the coverage threshold
        run: scripts/check-coverage.sh 80

  # The release binary has to start and stay up: nothing else exercises @main,
  # the app delegate or the panel controller.
  smoke:
    name: Launch smoke test
    runs-on: macos-15
    needs: build
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build -c release
      - name: Launch and stay up
        run: scripts/smoke-launch.sh .build/release/NotchBar

  # The release job runs this script on Linux while it is developed on macOS,
  # where BSD and GNU disagree (mktemp templates, sed -i). Rehearsing the real
  # rewrite here is what keeps that gap from surfacing mid-release.
  cask-bump:
    name: Cask bump dry run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: Periicles/homebrew-tap
          path: tap

      - name: Dry-run the bump against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh release view --json tagName --jq '.tagName' | sed 's/^v//')"
          scripts/bump-cask.sh "$version" tap --dry-run
