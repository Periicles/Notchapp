name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        env:
          # Pinned: `brew install swiftlint` tracks latest, so a new default rule
          # can turn CI — and a release build — red with no code change.
          SWIFTLINT_VERSION: 0.65.0
        run: |
          curl -sSLf -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Run SwiftLint
        run: swiftlint

  build:
    name: Build
    runs-on: macos-15
    needs: lint
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build -c release

  test:
    name: Test
    runs-on: macos-15
    needs: build
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test

  # The release job runs this script on Linux while it is developed on macOS,
  # where BSD and GNU disagree (mktemp templates, sed -i). Rehearsing the real
  # rewrite here is what keeps that gap from surfacing mid-release.
  cask-bump:
    name: Cask bump dry run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check out the tap
        uses: actions/checkout@v5
        with:
          repository: Periicles/homebrew-tap
          path: tap

      - name: Dry-run the bump against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh release view --json tagName --jq '.tagName' | sed 's/^v//')"
          scripts/bump-cask.sh "$version" tap --dry-run
