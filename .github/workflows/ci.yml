name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        env:
          # Pinned: `brew install swiftlint` tracks latest, so a new default rule
          # can turn CI — and a release build — red with no code change.
          SWIFTLINT_VERSION: 0.65.0
        run: |
          curl -sSLf -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Run SwiftLint
        run: swiftlint

  build:
    name: Build
    runs-on: macos-15
    needs: lint
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build -c release

  test:
    name: Test
    runs-on: macos-15
    needs: build
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
