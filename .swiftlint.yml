excluded:
  - .build
  - Tests
  - Supporting
  - Package.swift

opt_in_rules:
  - force_unwrapping
  - sorted_imports
  - empty_count
  - prefer_self_type_over_type_of_self

disabled_rules:
  - todo

trailing_comma:
  mandatory_comma: true

line_length:
  warning: 120
  error: 160
  ignores_comments: true

file_length:
  warning: 300
  error: 500

function_body_length:
  warning: 50
  error: 80

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - x
    - y
